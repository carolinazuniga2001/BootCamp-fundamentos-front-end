<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>

    <header class="text-center"> 
        <h1>Perfil Estudiante</h1>
    </header>

    <nav class="navbar navbar-expand-sm bg-light"> 
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Perfil Estudiante</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Certificados</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Asignaturas</a>
                </li>
            </ul>
            </div>
        </div>
    </nav> 

    <main class="container">
        <div class="row">
            <div class="col-md-6">
                <form id="miFormulario" action="#" method="post" class=" border mt-4 p-3">
                        <div class="mb-3 mt-3">
                            <label for="nombre" class="form-label">Nombre Completo:</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre completo">
                        </div>
                        <div class="mb-3">
                            <label for="edad" class="form-label">Edad:</label>
                            <input type="number" class="form-control" id="edad" placeholder="Ingrese su edad">
                        </div>
                        <div class="mb-3">
                            <label for="Carrera" class="form-label">Carrera:</label>
                            <input type="text" class="form-control" id="Carrera" placeholder="Ingrese su carrera">
                        </div>
                        <button type="button" onclick="mostrarperfil()" class="btn btn-primary">Mostrar Perfil</button>
                </form>
            </div> 

        <div class="col-md-6"> 
            <section class="border p-3 mt-4">   
                <h2>Perfil del Estudiante</h2>
                <p id="resultadoNombre" class="mt-4 text-start">Nombre:</p>
                <p id="resultadoEdad" class="text-start">Edad:</p>
                <p id="resultadoCarrera" class="text-start">Carrera:</p>
            </section>
        </div>
    </main> 

    <script>
        function mostrarperfil() {
            let nombre = document.getElementById("nombre").value;
            let edad = document.getElementById("edad").value;
            let carrera = document.getElementById("Carrera").value;

            document.getElementById("resultadoNombre").textContent = "Nombre: " + nombre;
            document.getElementById("resultadoEdad").textContent = "Edad: " + edad;
            document.getElementById("resultadoCarrera").textContent = "Carrera: " + carrera;
        }
    </script>

</body> 
</html>
