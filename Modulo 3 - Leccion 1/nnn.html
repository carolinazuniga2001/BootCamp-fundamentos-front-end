<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de cargas familiares</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <header>
        <div class="bg-primary text-white text-center py-4 shadow">
            <h1 class="mb-0">Calculadora de cargas familiares</h1>
        </div>
    </header>

    <main class="container-fluid">

        <div class="row">

            <aside class="col-md-3 text-dark p-0">

                <div class="p-4 text-dark border-bottom">
                    <h4 class="mb-0">Menú</h4>
                </div>

                <ul class="navbar-nav">

                    <li class="nav-item dropdown">
                        <a class="nav-link text-dark py-3 border-bottom dropdown-toggle"
                           href="#"
                           role="button"
                           data-bs-toggle="dropdown"
                           aria-expanded="false">
                            Otros proyectos
                        </a>

                        <ul class="dropdown-menu">
                            <li>
                                <a href="#" class="dropdown-item">
                                    Calculadora de medidas de temperatura
                                </a>
                            </li>

                            <li>
                                <a href="#" class="dropdown-item">
                                    Opción 2
                                </a>
                            </li>

                            <li>
                                <a href="#" class="dropdown-item">
                                    Opción 3
                                </a>
                            </li>
                        </ul>

                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark py-3 border-bottom">
                            Acerca de
                        </a>
                    </li>

                </ul>

            </aside>

            <!-- Contenido principal -->
            <section class="col-md-9 p-4">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white">
                        Calculadora
                    </div>

                    <div class="card-body">

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Número de cargas familiares:
                            </label>

                            <input
                                type="number"
                                placeholder="Ingrese el número de cargas familiares"
                                id="cargafamiliar"
                                class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Sueldo base:
                            </label>
                            <input
                                type="number"
                                placeholder="Ingrese su sueldo base"
                                id="sueldobase"
                                class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Operaciones:
                            </label>

                            <select id="operacion" class="form-select">
                                <option value="0">Seleccione una opción</option>
                                <option value="1">Calcular bono por carga familiar</option>
                            </select>
                        </div>

                        <div class="alert alert-primary text-center mt-4">
                            <h5 class="mb-2">Resultado</h5>
                            <p id="resultado" class="mb-0 fs-4 fw-bold"></p>
                        </div>

                        <div class="text-end">
                            <button
                                class="btn btn-primary px-4"
                                id="calcular"
                                onclick="operacion();">
                                Calcular
                            </button>
                        </div>

                    </div>

                </div>

            </section>

        </div>

    </main>

    <footer>
        <div class="bg-dark text-light text-center py-3">
            <p class="mb-0">
                Desarrollado por Carolina Zuñiga
            </p>
        </div>
    </footer>

    <script>
    function operacion() {
    const cargafamiliar = parseFloat(document.getElementById('cargafamiliar').value);
    const sueldobase = parseFloat(document.getElementById('sueldobase').value);
    const operacion = document.getElementById('operacion').value;

    let resultado;

    if (isNaN(cargafamiliar)) {
        alert('Por favor, ingrese un número válido para el número de cargas familiares.');
        return;
    }

    if (isNaN(sueldobase)) {
        alert('Por favor, ingrese un sueldo válido.');
        return;
    }

    switch (operacion) {
        case '1':
            resultado = sueldobase * 0.02 * cargafamiliar;
            break;

        default:
            alert('Por favor, seleccione una operación válida.');
            return;
    }

    document.getElementById('resultado').textContent =
        `El bono por ${cargafamiliar} cargas familiares es: $${resultado.toLocaleString('es-CL')}`;
}
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
