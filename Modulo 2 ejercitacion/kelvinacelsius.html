<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelvin a Celsius</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>

    <header class="text-center"> 
        <h1>kelvin a Celsius</h1>
    </header>

    <nav class="navbar navbar-expand-sm bg-light"> 
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="nav navbar-pills">
                <li class="nav-item">
                    <a class=" text-dark nav-link Inicio" href="#">Inicio</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="text-dark nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#"> Conversor de Temperatura</a>
                    <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="./celsiusakelvin.html" target="_blank">Celsius a Kelvin</a></li>   
                    <li><a class="dropdown-item" href="./fahrenheitakelvin.html" target="_blank">Fahrenheit a Kelvin</a></li>
                    </ul>
                </li>
            </ul>
            </div>
        </div>
    </nav> 

    <main class="container">
        <div class="row">
            <div class="col-md-6">
                <form id="miFormulario" action="#" method="post" class=" border mt-4 p-3">
                        <div class="mb-3 mt-3">
                            <label for="nombre" class="form-label">Temperatura en grados Kelvin:</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ingrese la temperatura en grados Kelvin">
                        </div>
                        <button type="button" onclick="convertir()" class="btn btn-primary"> Convertir </button>
                </form>
            </div> 

        <div class="col-md-6"> 
            <section class="border p-3 mt-4">   
                <h2>Resultado</h2>
                <p id="resultado" class="mt-4 text-start">Temperatura en Celsius:</p>
            </section>
        </div>
    </main> 

    <script>
        function convertir() {
            let kelvin = document.getElementById("nombre").value;
            let celsius = kelvin - 273.15;

            document.getElementById("resultado").textContent = "Temperatura en Celsius: " + celsius.toFixed(2);
        }
    </script>

</body> 
</html>
