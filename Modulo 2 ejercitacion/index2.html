<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio de profundización</title>
        
        <style>
            body {
                margin-top: 0;
            }
        </style>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <div class="p-3 bg-dark text-primary">
                <h1>Operaciones aritméticas</h1>
            </div>
        </header>
        <main>
            <div class="row">
                <aside class="sidebar col-3">
                    <nav class="navbar bg-light">
                        <div class="container-fluid">
                            <ul class="navbar-nav">
                                <li class="nav-item">
                                    <a href="index.html" class="nav-link">Operaciones</a>
                                </li>
                                <li class="nav-item">
                                    <a href="#" class="nav-link">Acerca de</a>
                                </li>
                            </ul>
                        </div>
                    </nav>
                </aside>
                <section class="col-9">
                    <div class="container mt-3 p-3">
                        <div class="mb-3">
                            <label class="form-label">Número 1:</label>
                            <input type="number" placeholder="Ingrese el primer número" id="numero1" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Número 2:</label>
                            <input type="number" placeholder="Ingrese el segundo número" id="numero2" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Operaciones:</label>
                            <select id="operacion" class="form-control">
                                <option value="0">Seleccione una opción</option>
                                <option value="1">Sumar</option>
                                <option value="2">Restar</option>
                                <option value="3">Multiplicar</option>
                                <option value="4">Dividir</option>
                            </select>
                        </div>
                        <div>
                            <p id="resultado"></p>
                        </div>                        
                        <div class="mb-3 text-end">
                            <button class="btn btn-primary" id="calcular" onclick="operacion();">Calcular</button>
                        </div>
                    </div>
                </section>
            </div>
        </main>
        <footer>
            <div class="mt-3 p-3 bg-dark text-light text-center">
                <p>Desarrollado por Carolina Zuñiga</p>
            </div>
        </footer>
        <script>
            function operacion() {
                const numero1 = Number(document.getElementById("numero1").value);
                const numero2 = Number(document.getElementById("numero2").value);
                if (document.getElementById("operacion").value == "1"){
                    resultado = numero1 + numero2;    
                } else if (document.getElementById("operacion").value == "2") {
                    resultado = numero1 - numero2;
                } else if (document.getElementById("operacion").value == "3") {
                    resultado = numero1 * numero2;
                } else if (document.getElementById("operacion").value == "4") {
                    resultado = numero1 / numero2;
                } else {
                    resultado = "";
                }
                
                document.getElementById("resultado").textContent = resultado;
            }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
