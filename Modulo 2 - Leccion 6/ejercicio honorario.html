<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Página de saludo</title>
        <script src="./js/jquery-4.0.0.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <style>
            .enviar-rojo{
                background-color: #ff0543;
                color: white;
                border: none;
            }

            .enviar-rojo:hover{
                background-color: white;
                color: #ff0543;
                border: none;
            }
        </style>
    </head>
    <body>
        <h1>Ejercicio</h1>
        <div class="d-flex mt-3"> 
            <input type="number" placeholder="Ingrese monto" id="monto">
        
            <button class="btn enviar-rojo ms-3" id="btnResultado">Resultado</button>
        </div>

        <div class="mt-3">

            <span id="retencion"></span>
            <span id="valor"></span>

        </div>

        <script>

            $("#btnResultado").click(
                function () {
                    //Recupero el monto desde el input
                    let monto = parseFloat($("#monto").val());
                    
                    //Calculo el honorario (15,25%)
                    let honorario = monto * 0.1525;

                    //total final 
                    let valor = monto - honorario;
                    
                    //Muestro la retencion
                    $("#retencion").text("La retención de boleta de honorario es: $" + honorario.toFixed(2));
                    
                    //Muestro el total final
                    $("#valor").text("El monto total es: $" + valor.toFixed(2));
                }
            );
        </script>   
    </body>
</html>
