<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Página de saludo</title>
        <script src="./js/jquery-4.0.0.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <style>
            .enviar-rojo{
                background-color: #ff0543;
                color: white;
                border: none;
            }

            .enviar-rojo:hover{
                background-color: white;
                color: #ff0543;
                border: none;
            }
        </style>
    </head>
    <body>
        <h1>Ejercicio</h1>
        <div class="d-flex mt-3"> 
            <input type="text" placeholder="Ingrese su nombre" id="nombre">
        
            <button class="btn enviar-rojo ms-3" id="btnSaludo">Enviar</button>
        </div>

        <div class="mt-3">

            <span id="saludo"></span>

        </div>

        <script>

            $("#btnSaludo").click(
                function () {
                    //Recupero el nombre desde el input
                    let nombre = $("#nombre").val();
                    
                    //Creo el mensaje de saludo
                    let mensaje = "Hola, " + nombre + "! Bienvenido.";
                    
                    //Muestro el mensaje en el párrafo
                    $("#saludo").text(mensaje);
                }
            );
        </script>   
    </body>
</html>
